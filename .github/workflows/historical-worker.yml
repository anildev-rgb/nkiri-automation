name: Nkiri historical worker fleet

on:
  workflow_dispatch:
  schedule:
    # Avoid GitHub's busiest top-of-hour window. The worker fleet starts twice
    # per hour; four runners each launch four independent queue workers.
    - cron: '7,37 * * * *'

concurrency:
  group: nkiri-historical-worker-fleet
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  worker:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: runner-0
            label: Runner 1 (4 workers)
            runner_index: 0
          - id: runner-1
            label: Runner 2 (4 workers)
            runner_index: 1
          - id: runner-2
            label: Runner 3 (4 workers)
            runner_index: 2
          - id: runner-3
            label: Runner 4 (4 workers)
            runner_index: 3
    env:
      NKIRI_URL: https://nkiri.vip
      NKIRI_API_TOKEN: ${{ secrets.NKIRI_API_TOKEN }}
      API_TOKEN: ${{ secrets.NKIRI_API_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      VIDFILES_API_KEY: ${{ secrets.VIDFILES_API_KEY }}
      NKIRI_MIN_FREE_GB: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout lane state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim disposable runner space
        run: |
          # These are preinstalled on temporary GitHub runners and unused by
          # this Python worker. The repository, site, and VidFiles are untouched.
          # Do not let an unusually slow image cleanup hold a worker hostage.
          timeout 75s sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          timeout 20s sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          python3 - <<'PY'
          import shutil
          total, used, free = shutil.disk_usage('.')
          print(f"workspace_total_gb={total / 1024**3:.2f}")
          print(f"workspace_free_gb={free / 1024**3:.2f}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Process four assigned queue workers
        run: python fullauto/parallel_worker.py --runner-index "${{ matrix.runner_index }}"

      - name: Persist this lane's resumable state
        env:
          LANE_NAME: ${{ matrix.id }}
        run: |
          mapfile -t state_files < <(find fullauto -maxdepth 1 -type f \( \
            -name 'state-movies-shard-*.json' -o \
            -name 'state-english-series-shard-*.json' -o \
            -name 'state-korean-dramas-shard-*.json' \
          \) -print)
          if [ "${#state_files[@]}" -eq 0 ]; then
            echo "No sharded lane-state files found."
            exit 0
          fi
          git config user.name "nkiri-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${state_files[@]}"
          git diff --cached --quiet && exit 0
          git commit -m "Update $LANE_NAME historical state"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Could not persist $LANE_NAME state after five retries."
          exit 1

  controller-summary:
    name: Fleet controller summary
    needs: worker
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Write fleet health summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## Nkiri historical worker fleet")
          for path in sorted(Path("fullauto").glob("state-*-shard-*.json")):
              try:
                  state = json.loads(path.read_text(encoding="utf-8"))
                  records = list((state.get("processed") or {}).values())
                  done = sum(1 for item in records if isinstance(item, dict) and item.get("status") == "done")
                  pending = sum(1 for item in records if isinstance(item, dict) and item.get("status") == "pending")
                  blocked = sum(1 for item in records if isinstance(item, dict) and item.get("status") == "blocked")
                  print(f"- `{path.name}`: {done} done, {pending} pending, {blocked} blocked")
              except Exception as exc:
                  print(f"- `{path.name}`: unreadable ({exc})")
          print("- Lanes have a 90-minute hard timeout. Partial uploads are saved after each file and resume next run.")
          PY

      - id: progress
        name: Decide whether more historical work remains
        run: |
          remaining="$(python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          lanes = []
          for index in range(8):
              lanes.append(("queue/missing-movies.csv", f"fullauto/state-movies-shard-{index}.json", index, 8))
          for index in range(4):
              lanes.append(("queue/missing-series.csv", f"fullauto/state-english-series-shard-{index}.json", index, 4))
              lanes.append(("queue/missing-korean-dramas.csv", f"fullauto/state-korean-dramas-shard-{index}.json", index, 4))

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8")).get("processed", {})
              except Exception:
                  return {}

          def complete(value):
              if isinstance(value, str):
                  return value == "done" or value.startswith("skipped")
              return isinstance(value, dict) and value.get("status") in {"done", "blocked"}

          remaining = 0
          for queue_file, state_file, shard_index, shard_count in lanes:
              processed = load(state_file)
              with open(queue_file, encoding="utf-8-sig", newline="") as fh:
                  rows = [row for row in csv.DictReader(fh)
                          if (row.get("source_url") or "").strip() and (row.get("title") or row.get("name") or "").strip()]
              for position, row in enumerate(rows):
                  if position % shard_count != shard_index:
                      continue
                  if not complete(processed.get((row.get("source_url") or "").strip())):
                      remaining += 1
          print(remaining)
          PY
          )"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "- Actionable queue rows remaining: $remaining" >> "$GITHUB_STEP_SUMMARY"

      - name: Queue the next fleet run when work remains
        if: steps.progress.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/352142163/dispatches" \
            -d '{"ref":"main"}'
          echo "Queued the next fleet run."
